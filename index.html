<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f5f7fa">
  <link rel="preconnect" href="https://map.qq.com">
  <meta name="description" content="武汉市 50 个景点地图，含近10天历史人流参考、预约购票信息、路线规划。覆盖黄鹤楼、武汉大学、东湖等必游景点。">
  <meta property="og:title" content="武汉景点地图 — 50个景点近10天人流参考 & 路线规划">
  <meta property="og:description" content="武汉市景点地图，含近10天典型人流参考、预约信息、路线规划，适合出行前规划。">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="武汉景点地图">
  <meta name="twitter:description" content="50个景点人流参考 & 路线规划">
  <title>武汉景点地图 — 50个景点人流参考 & 路线规划</title>
<link rel="stylesheet" href="style.min.css">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "武汉景点地图",
    "description": "武汉市景点地图，含人流参考、预约信息、路线规划",
    "applicationCategory": "TravelApplication",
    "operatingSystem": "Web",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "CNY" }
  }
  </script>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-title" content="武汉景点">
</head>
<body>
<div id="app">
  <aside id="panel">
    <div class="p-head">
      <div class="p-head-row">
        <h1>🏙️ 武汉景点地图</h1>
        <button id="menuBtn" class="mi-btn" title="菜单" aria-label="菜单" aria-expanded="false" aria-controls="menu">☰</button>
        <button id="collapseBtn" class="mi-btn" title="收起侧栏" aria-label="收起侧栏">«</button>
      </div>
      <div class="sub">精选 50 个景点 · 预约 &amp; 人流</div>
      <div class="live-status sim" id="liveStatus">🟡 本地动态估算 · 更新于 --:--:--</div>
    </div>
    <div class="filters">
      <div class="f-row">
        <div class="q-wrap">
          <input class="search" id="q" placeholder="🔍 搜索景点名称…" autocomplete="off">
          <div class="q-list" id="qList" style="display:none"></div>
        </div>
        <button class="f-toggle" data-f="cf-crowd" title="人群筛选" aria-label="人群筛选" aria-expanded="false">👥</button>
        <button class="f-toggle" data-f="cf-reserve" title="预约筛选" aria-label="预约筛选" aria-expanded="false">🎫</button>
        <button class="f-toggle" data-f="cf-sort" title="排序" aria-label="排序" aria-expanded="false">↕️</button>
        <button class="f-toggle" data-f="cf-zone" title="区域·地铁筛选" aria-label="区域·地铁筛选" aria-expanded="false">🗺</button>
      </div>
      <div class="f-panel" id="cf-crowd" hidden>
        <div class="chips">
          <span class="chip active" data-v="">全部</span><span class="chip" data-v="高">高</span><span class="chip" data-v="中">中</span><span class="chip" data-v="低">低</span>
        </div>
      </div>
      <div class="f-panel" id="cf-reserve" hidden>
        <div class="chips">
          <span class="chip active" data-v="">全部</span><span class="chip" data-v="need_reserve">⏱ 需预约</span><span class="chip" data-v="need_ticket">¥ 需购票</span><span class="chip" data-v="free">✓ 免预约</span>
        </div>
      </div>
      <div class="f-panel" id="cf-sort" hidden>
        <div class="chips">
          <span class="chip active" data-v="">默认</span><span class="chip" data-v="dist">📏 距离</span><span class="chip" data-v="heat">🔥 热度</span>
        </div>
      </div>
      <div class="f-panel" id="cf-zone" hidden>
        <div class="chips" id="zoneChips">
          <span class="chip active" data-v="">全部区域</span><span class="chip" data-v="武昌">武昌</span><span class="chip" data-v="汉口">汉口</span><span class="chip" data-v="汉阳">汉阳</span><span class="chip" data-v="远郊">远郊</span>
        </div>
        <div class="chips" id="metroChips"></div>
      </div>
    </div>
    <div class="board" id="board"></div>
    <div class="list" id="list"></div>
  </aside>

  <main id="mapwrap">
    <div id="map"></div>
    <div id="boot">🚀 正在加载腾讯地图…</div>
    <div id="spotPopup" class="spot-popup">
      <div class="pp-inner">
        <button class="pp-close" id="ppClose" title="关闭">✕</button>
        <div class="pp-content"></div>
      </div>
      <div class="pp-arrow"></div>
    </div>
    <div id="menu" class="menu" hidden>
      <div class="menu-head">行程</div>
      <div class="itin-list" id="itinList"></div>
      <div class="menu-head">工具</div>
      <button class="menu-item" id="btnRoute" title="路线查询">🛣️ 路线查询</button>
      <button class="menu-item" id="btn-measure" title="测量距离">📏 测距</button>
      <button class="menu-item" id="btn-north" title="回正北方向">🧭 回正北</button>
      <button class="menu-item" id="reset" title="复位视图">📍 复位视图</button>
      <div class="menu-head">底图</div>
      <button class="menu-item" id="btn-vec" aria-pressed="true">🗺 标准</button>
      <button class="menu-item" id="btn-sat" aria-pressed="false">🛰 卫星</button>
      <button class="menu-item" id="btn-traffic" title="实时路况（腾讯）" aria-pressed="false">🚦 路况</button>
      <div class="menu-head">显示</div>
      <button class="menu-item" id="btn-crowd-color" title="人流着色" aria-pressed="false">👥 人流色</button>
      <button class="menu-item" id="btn-theme" title="切换到夜间模式" aria-pressed="false">🌙 夜间</button>
      <button class="menu-item" id="btn-violet" title="切换到紫晶模式" aria-pressed="false">💜 紫晶</button>
      <button class="menu-item" id="btn-pitch" title="切换 3D 俯仰视角" aria-pressed="false">🕋 3D</button>
      <div class="menu-head">图例</div>
      <div class="legend" id="legend"></div>
    </div>
    <button class="btn" id="locateBtn" title="回到我的位置">📍</button>
    <button class="btn" id="toggle">☰ 列表</button>
    <button class="btn" id="expandBtn">☰ 展开列表</button>
    <div id="measurePanel" class="measure-panel" style="display:none">
      <div class="mp-title">📏 测距</div>
      <div class="mp-row">路程 <b id="mpPath">—</b></div>
      <div class="mp-row">直线 <b id="mpLine">—</b></div>
      <div class="mp-hint">单击加点 · 双击结束 · 右键取消</div>
    </div>
    <div id="routePanel" class="route-panel">
      <div class="rp-title"><span>🚗 路线查询</span><button id="rpFold" title="折叠/展开">▾</button></div>
      <div class="rp-body">
        <div class="rp-modes" id="rpModes" role="radiogroup" aria-label="路线出行方式">
          <button class="rp-mode active" data-mode="driving" role="radio" aria-checked="true">🚗 驾车</button>
          <button class="rp-mode" data-mode="walking" role="radio" aria-checked="false">🚶 步行</button>
          <button class="rp-mode" data-mode="bicycling" role="radio" aria-checked="false">🚴 骑行</button>
          <button class="rp-mode" data-mode="transit" role="radio" aria-checked="false">🚌 公交</button>
        </div>
        <div class="rp-row"><span class="rp-ico rp-from"></span><label for="rpFrom" class="sr-only">出发点</label><input id="rpFrom" list="rpFromList" placeholder="出发点，如：黄鹤楼" aria-label="出发点"><datalist id="rpFromList"></datalist></div>
        <div class="rp-row rp-row-swap"><button id="rpSwap" class="rp-swap" title="互换起点与目的地" aria-label="互换起点与目的地">⇅</button></div>
        <div class="rp-row"><span class="rp-ico rp-to"></span><label for="rpTo" class="sr-only">到达点</label><input id="rpTo" list="rpToList" placeholder="到达点，如：湖北省博物馆" aria-label="到达点"><datalist id="rpToList"></datalist></div>
        <div class="rp-wp-title">📍 途经景点（点左侧列表 <b>+</b> 添加）</div>
        <div class="rp-wp" id="rpWaypoints"><span class="rp-wp-empty">尚未添加途经景点</span></div>
        <div class="rp-actions"><button id="rpGo">查询路线</button><button id="rpClear">清除</button><button id="rpShare" title="复制分享链接（当前筛选+行程）">📋 分享</button></div>
        <div class="rp-summary" id="rpSummary" style="display:none">
          <span class="rp-sum-line">直线 <b id="rpLineSummary">—</b></span>
        </div>
        <div class="rp-cards" id="rpCards"></div>
      </div>
    </div>
    <div class="zoom-indicator" id="zoomIndicator" aria-live="polite" title="按 + / - 调整缩放">
      <span class="zoom-label">缩放</span>
      <span class="zoom-level" id="zoomLevel">11</span>
      <button class="zoom-btn" id="zoomOut" title="缩小 (-)">−</button>
      <button class="zoom-btn" id="zoomIn" title="放大 (+)">+</button>
      <button class="zoom-help" id="zoomHelp" title="显示快捷键面板 (?)">?</button>
    </div>
  </main>
</div>

<script src="spots.data.js" defer></script>
<script src="app.min.js" defer></script>

</body>
</html>
