<head>

<title>404 — 武汉景点地图</title>
<style>
  body{font-family:"Microsoft YaHei",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(180deg,#f8fafc,#eef2f7);color:#1c2430;margin:0;padding:24px;text-align:center}
  .code{font-size:64px;font-weight:800;line-height:1;color:#e5484d;letter-spacing:2px}

<body>

<a id="home" href="/">回到首页</a>
<script>
  // 项目站部署在子路径（如 /wuhan-travel-map/），根路径则直回根。
  // 按第一段路径推导站点根，避免硬编码子路径。
  var seg = location.pathname.split('/').filter(Boolean);
  document.getElementById('home').href = (seg.length > 1) ? '/' + seg[0] + '/' : '/';
</script>
